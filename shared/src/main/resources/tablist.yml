# ---------------------------------------------------------------------------
#  Honeycomb - tablist
#
#  Header and footer are lists of lines. Every line is MiniMessage and supports
#  placeholders (%player_name%) and animations (<anim:honeycomb>).
#
#  The header/footer written here form a profile called "default". Extra layouts
#  live under "profiles"; the highest priority matching layout wins.
# ---------------------------------------------------------------------------

tablist:
  enabled: true

  # Ticks between refreshes (20 ticks = 1 second).
  update-interval: 40

  header:
    - "<shadow:#000000:1><dark_gray>                          </shadow>"
    - "<shadow:#000000:1><bold><gradient:#FFE3A8:#FFB01F:#FF7A00>HONEYCOMB</gradient></bold></shadow>"
    - "<shadow:#000000:1><gray>Welcome back, <white>%player_name%</shadow>"
    - "<shadow:#000000:1><dark_gray>                          </shadow>"

  footer:
    - "<shadow:#000000:1><dark_gray>                          </shadow>"
    - "<shadow:#000000:1><gray>Players <white>%server_online%<dark_gray>/</dark_gray><white>%server_max_players% <dark_gray>|</dark_gray> <gray>Ping <white>%player_ping%ms"
    - "<shadow:#000000:1><gray>play.example.net</shadow>"

  # Name shown in the player list. Remove the line to leave names untouched.
  player-list-name: "<white>%player_name%"

  # Additional layouts. Each one may define its own header, footer, list name,
  # update interval and conditions.
  profiles:
    # Staff only layout. Switched on with staff.tablist in config.yml
    # or from the panel under Staff.
    staff:
      staff: true
      priority: 10
      header:
        - "<gradient:#38BDF8:#2563EB><bold>HONEYCOMB STAFF</bold></gradient>"
      footer:
        - "<gray>TPS: <green>%server_tps%"
        - "<gray>Online: <yellow>%server_online%"
      player-list-name: "<aqua>[STAFF]</aqua> <white>%player_name%"
      conditions:
        permissions:
          - honeycomb.staff
