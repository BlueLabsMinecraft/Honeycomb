# ---------------------------------------------------------------------------
#  Honeycomb - messages
#
#  Everything here is MiniMessage. {placeholders} in braces are filled in by the
#  command that sends the message; %percent% placeholders are not used here.
# ---------------------------------------------------------------------------

prefix: "<shadow:#000000:1><bold><gradient:#FFE3A8:#FFB01F:#FF7A00>HONEYCOMB</gradient></bold></shadow> <shadow:#000000:1><dark_gray>»</dark_gray></shadow> "

panel:
  saved: "<green>Saved {kind} <white>{name}</white> and applied it."
  save-failed: "<red>Could not save: <white>{reason}"
  name-required: "<red>Give it a name first."
  icon-invalid: "<red>That item name does not look right. Try diamond, oak_log or bread."
  created: "<green>Created {kind} <white>{name}</white>. Opening it now."
  name-taken: "<red>{name} <gray>is already used. Pick another name, or edit the one that exists."

general:
  no-permission: "<red>You do not have permission to do that."
  player-only: "<red>That can only be used by a player."
  unknown-subcommand: "<red>'<white>{input}</white>' is not a subcommand. <gray>Did you mean <yellow>/honeycomb {suggestion}</yellow>? Everything is listed in <yellow>/honeycomb help</yellow>."
  invalid-usage: "<red>Usage: <white>{usage}"
  maintenance-status: "<gray>Maintenance is"
  reloading: "<gray>Reloading configuration..."
  reload-success: "<green>Reloaded in <white>{time}ms</white>. <gray>{summary}"
  reload-failed: "<red>Reload finished with problems: <white>{summary}</white>. See the console for details."
  refresh-success: "<green>Refreshed {count} display(s) for you."

command:
  help-header: "<shadow:#000000:1><bold><gradient:#FFE3A8:#FFB01F:#FF7A00>HONEYCOMB</gradient></bold></shadow> <dark_gray>v{version} <dark_gray>| <gray>{mc}"
  help-group: ""
  help-title-displays: "<shadow:#000000:1><gold><bold>DISPLAYS"
  help-title-server: "<shadow:#000000:1><gold><bold>SERVER"
  help-title-moving: "<shadow:#000000:1><gold><bold>COMING FROM TAB"
  help-title-other: "<shadow:#000000:1><gold><bold>OTHER"
  help-line: "<dark_gray> /<white>{label}</white> <gray>{usage}<dark_gray>- <gray>{description}"
  version: "<gray>Honeycomb <white>{version}</white> <dark_gray>|</dark_gray> <gray>build <white>{range}</white> <dark_gray>|</dark_gray> <gray>server <white>{server}</white> <dark_gray>|</dark_gray> <gray>java <white>{java}</white>"
  status-header: "<dark_gray>-- <gray>Display status <dark_gray>--"
  status-line: "<gray>{name}: {state} <dark_gray>|</dark_gray> <dark_gray>{detail}"
  status-disabled: "<red>disabled"
  status-enabled: "<green>enabled"
  test-sent: "<green>Sent a test display through <white>{system}</white>."
  test-no-display: "<red>{system} is not active for you right now."
  placeholders-header: "<dark_gray>-- <gray>Placeholder demo for <white>{player}</white> <dark_gray>--"
  placeholders-unknown: "<gray>Unknown placeholders seen: <yellow>{list}"
  animations-header: "<dark_gray>-- <gray>Animations ({count}) <dark_gray>--"
  animations-line: "<gray>{id} <dark_gray>|</dark_gray> <gray>{frames} frames <dark_gray>|</dark_gray> <gray>every {interval} ticks"
  animations-preview: "<gray>{id}: {frame}"
  integrations-header: "<dark_gray>-- <gray>Integrations <dark_gray>--"
  integrations-line: "<gray>{name}: {state} <dark_gray>{detail}"
  debug-header: "<dark_gray>-- <gray>Debug report <dark_gray>--"
  debug-line: "<gray>{line}"
  debug-written: "<green>Wrote <white>{file}</white>."

scoreboard:
  failed: "<red>Your scoreboard could not be drawn: <white>{reason}</white>. <gray>Send this line to the developer."
