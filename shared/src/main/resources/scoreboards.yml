# ---------------------------------------------------------------------------
#  Honeycomb - sidebar scoreboards
#
#  Each child section is a layout. The highest priority layout whose conditions
#  match is shown; layouts are updated in place, so the sidebar never flickers.
#  Up to 15 lines are rendered (a Minecraft limit).
# ---------------------------------------------------------------------------

scoreboards:
  enabled: true

  default:
    priority: 0
    update-interval: 20
    # true hides the red score numbers next to each line.
    hide-numbers: true
    title: "<shadow:#000000:1><bold><gradient:#FFE3A8:#FFB01F:#FF7A00>HONEYCOMB</gradient></bold></shadow>"
    lines:
      - "<shadow:#000000:1><dark_gray>                     </shadow>"
      - "<shadow:#000000:1><gray>Player <dark_gray>| <white>%player_name%</shadow>"
      - "<shadow:#000000:1><gray>World <dark_gray>| <white>%player_world%</shadow>"
      - "<shadow:#000000:1><gray>Ping <dark_gray>| <white>%player_ping%ms</shadow>"
      - ""
      - "<shadow:#000000:1><gray>Online <dark_gray>| <white>%server_online%<dark_gray>/</dark_gray><white>%server_max_players%</shadow>"
      - "<shadow:#000000:1><gray>TPS <dark_gray>| <white>%server_tps%</shadow>"
      - "<shadow:#000000:1><dark_gray>                     </shadow>"
      - "<shadow:#000000:1><aqua>play.example.net</shadow>"

  # Staff only layout. Switched on with staff.scoreboard in config.yml
  # or from the panel under Staff.
  staff:
    staff: true
    priority: 50
    update-interval: 20
    hide-numbers: true
    title: "<gradient:#38BDF8:#2563EB><bold>STAFF VIEW</bold></gradient>"
    lines:
      - "<white>Player: <aqua>%player_name%"
      - "<white>Group: <gold>%player_group%"
      - "<white>AFK: <yellow>%player_afk_tag%"
      - ""
      - "<white>TPS: <green>%server_tps%"
      - "<white>MSPT: <green>%server_mspt%"
      - "<white>Memory: <green>%server_memory_used%<dark_gray>/</dark_gray><green>%server_memory_max% MB"
      - "<white>Vanish: <yellow>%player_vanished%"
      - ""
      - "<dark_gray>━━━━━━━━━━━━"
    conditions:
      permissions:
        - honeycomb.staff

  # Balance driven layout. Works with any placeholder, the comparison is what
  # decides the layout, the text can say anything.
  high-roller:
    # Off by default: it needs an economy placeholder and would otherwise be the
    # layout everyone sees on a fresh install. Switch it on once Vault is present.
    enabled: false
    priority: 40
    update-interval: 20
    hide-numbers: true
    title: "<shadow:#000000:1><gradient:#FFD34A:#C8871B><bold>WALLET</bold></gradient></shadow>"
    lines:
      - "<shadow:#000000:1><gray>Balance</gray> <dark_gray>→</dark_gray> <green>$%vault_eco_balance_formatted%</green></shadow>"
      - "<shadow:#000000:1><gray>Server</gray> <dark_gray>→</dark_gray> <white>yourserver.net</white></shadow>"
    conditions:
      placeholders:
        - "%vault_eco_balance% >= 100000"
