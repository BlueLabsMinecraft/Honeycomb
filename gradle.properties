# Honeycomb build properties.
#
# The modern module needs a Java 25 toolchain (Minecraft 26.1+ runs on Java 25),
# the legacy module needs Java 21. Gradle auto-detects locally installed JDKs; the
# explicit list below is only a hint for machines with custom install locations.
org.gradle.java.installations.paths=/opt/jdk-21.0.13+9,/opt/jdk-25

org.gradle.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
